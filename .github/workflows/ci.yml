name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate (skill, hooks, coverage, tests, dist)
        run: bash scripts/validate.sh
      - name: Brain Score of our own READMEs (dogfooding the action)
        uses: ./
        with:
          files: "README.md README.ko.md"
          min-score: "90"
