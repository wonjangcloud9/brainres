<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1280px;height:640px;background:#0f1117;color:#e8e6e3;
    font-family:-apple-system,"SF Pro Display","Helvetica Neue","Apple SD Gothic Neo",sans-serif}
  .wrap{padding:64px 80px;height:512px;display:flex;flex-direction:column;justify-content:space-between}
  h1{font-size:96px;margin:0;letter-spacing:-2px}
  .tag{font-size:40px;margin:12px 0 0;color:#c9c5bf}
  .vs{font-size:28px;color:#8b8780;margin-top:8px}
  .stats{display:flex;gap:28px}
  .stat{background:#1a1d26;border:1px solid #2b2f3a;border-radius:16px;padding:20px 26px}
  .n{font-size:44px;font-weight:700;color:#7ee2a8}
  .l{font-size:22px;color:#a8a49d;margin-top:4px}
  .score{color:#f0a36b}
</style></head><body><div class="wrap">
  <div>
    <h1>🧠 brainres</h1>
    <p class="tag">Claude answers your brain can actually read.</p>
    <p class="vs">Not shorter. Not more human. Easier to understand.</p>
  </div>
  <div class="stats">
    <div class="stat"><div class="n">793</div><div class="l">findings reviewed</div></div>
    <div class="stat"><div class="n">654/654</div><div class="l">applicable findings applied</div></div>
    <div class="stat"><div class="n">498</div><div class="l">tokens per session</div></div>
    <div class="stat"><div class="n score">50 → 100</div><div class="l">Brain Score, same question</div></div>
  </div>
</div></body></html>
