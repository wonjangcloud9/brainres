<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading Benchmark</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<style>
  :root { --bg:#fbfaf8; --fg:#1d1c1a; --muted:#6b6862; --card:#ffffff; --line:#e4e1db; --accent:#2f6f4f; --warn:#9a3b2b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14151a; --fg:#e9e7e3; --muted:#a19d96; --card:#1c1e25; --line:#2c2f39; --accent:#7ee2a8; --warn:#f0a36b; } }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.55 -apple-system,"Segoe UI","Apple SD Gothic Neo",sans-serif }
  main { max-width:760px; margin:0 auto; padding:24px 16px 64px }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin:16px 0 }
  .q { font-weight:600 }
  .muted { color:var(--muted); font-size:15px }
  button { font:inherit; padding:10px 16px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent) }
  @media (prefers-color-scheme: dark) { button.primary { color:#0f1117 } }
  button:disabled { opacity:.45; cursor:not-allowed }
  label.opt { display:block; padding:10px 12px; border:1px solid var(--line); border-radius:8px; margin:8px 0; cursor:pointer }
  label.opt input { margin-right:8px }
  .answer table { border-collapse:collapse; width:100%; font-size:15px; display:block; overflow-x:auto }
  .answer th, .answer td { border:1px solid var(--line); padding:6px 8px; text-align:left }
  .answer pre { background:rgba(127,127,127,.12); padding:10px; border-radius:8px; overflow-x:auto }
  .answer code { font-size:14px }
  .scale { display:flex; gap:8px; flex-wrap:wrap } .scale label { border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer }
  .two { display:grid; grid-template-columns:1fr; gap:12px } @media (min-width:900px){ main{max-width:1100px} .two{grid-template-columns:1fr 1fr} }
  textarea { width:100%; height:160px; font:13px/1.4 ui-monospace,monospace; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:8px }
  .progress { height:4px; background:var(--line); border-radius:2px; overflow:hidden } .progress div { height:100%; background:var(--accent) }
</style>
</head>
<body><main id="app"></main>
<script>
const DATA = {"study": 2, "versions": ["prose", "bullets"], "preference": false, "items": [{"id": "c1-cache", "lang": "en", "content": "causal", "question": "Why does my app sometimes show old data after an update?", "prose": "Your app reads from a cache that keeps a copy of the data for 10 minutes. When you update the database, the cache still holds the old copy, so reads return stale data until the 10 minutes run out. Because the cache doesn't know the database changed, only expiry or an explicit invalidation replaces the copy. So the fix is to delete the cache entry whenever you write that record.", "bullets": "- Your app reads from a cache\n- The cache keeps a copy for 10 minutes\n- Updates go to the database\n- The cache still holds the old copy\n- Reads return stale data until expiry\n- The cache doesn't know the database changed\n- Fix: delete the cache entry when you write that record", "quiz": {"item": "c1-cache", "content": "causal", "q1": {"kind": "find", "text": "How long does the cache keep a copy?", "options": ["1 minute", "10 minutes", "1 hour", "Until restart"], "answer": 1}, "q2": {"kind": "understand", "text": "You shorten the cache time to 1 minute but change nothing else. What happens after an update?", "options": ["Old data never appears", "Old data can still appear, but for at most about 1 minute", "The database stops updating", "The cache updates instantly"], "answer": 1}, "review": {"author_check": "both formats carry the same claims (2026-11-12)", "independent_check": "pending"}}}, {"id": "c2-inflation", "lang": "en", "content": "causal", "question": "Why does money in a 1% savings account lose value when inflation is 3%?", "prose": "Inflation of 3% means the same basket of goods costs 3% more each year. Your savings grow by only 1%, so each year your money buys about 2% less than the year before. Because the interest is smaller than the price rise, the account loses purchasing power even though the balance goes up. So a balance that looks bigger can still buy less.", "bullets": "- Inflation is 3% per year\n- Prices of the same goods rise 3%\n- Savings grow 1% per year\n- Balance goes up\n- Purchasing power falls about 2% per year\n- A bigger balance can buy less", "quiz": {"item": "c2-inflation", "content": "causal", "q1": {"kind": "find", "text": "By roughly how much does purchasing power fall each year?", "options": ["1%", "2%", "3%", "4%"], "answer": 1}, "q2": {"kind": "understand", "text": "If inflation dropped to 0.5% and the account still paid 1%, what would happen?", "options": ["Purchasing power would still fall", "Purchasing power would grow slightly", "The balance would shrink", "Nothing would change"], "answer": 1}, "review": {"author_check": "both formats carry the same claims (2026-11-12)", "independent_check": "pending"}}}, {"id": "c3-race", "lang": "en", "content": "causal", "question": "Why does my counter sometimes end up lower than the number of requests?", "prose": "Each request reads the counter, adds 1, and writes it back. When two requests read the same value at the same moment, both add 1 to it and both write the same result, so one increment is lost. Because the read and the write are separate steps, another request can slip in between them. So the fix is to make the increment one atomic operation, for example a database UPDATE counter = counter + 1.", "bullets": "- Each request reads the counter\n- It adds 1\n- It writes the value back\n- Two requests can read the same value at once\n- Both write the same result\n- One increment is lost\n- Fix: atomic increment (UPDATE counter = counter + 1)", "quiz": {"item": "c3-race", "content": "causal", "q1": {"kind": "find", "text": "What fix does the answer suggest?", "options": ["Add more servers", "Make the increment one atomic operation", "Restart the counter nightly", "Log every request"], "answer": 1}, "q2": {"kind": "understand", "text": "Would running requests one at a time (never in parallel) prevent the lost updates?", "options": ["Yes, because no request could read between another's read and write", "No, the database would still lose writes", "No, the counter would double-count", "Only if the counter starts at zero"], "answer": 0}, "review": {"author_check": "both formats carry the same claims (2026-11-12)", "independent_check": "pending"}}}, {"id": "c4-cert", "lang": "en", "content": "causal", "question": "Why does HTTPS need a certificate if it already encrypts traffic?", "prose": "Encryption alone only guarantees that nobody can read the traffic between you and *whoever* is on the other end. An attacker could set up their own encrypted connection and pretend to be your bank. The certificate proves the other end really is your bank, because a trusted authority signed it for that domain. So encryption keeps the conversation private, and the certificate makes sure it's with the right party.", "bullets": "- Encryption hides traffic from eavesdroppers\n- It doesn't prove who is on the other end\n- An attacker could pose as your bank over an encrypted connection\n- A certificate proves the server's identity\n- A trusted authority signs it for the domain\n- Privacy: encryption; right party: certificate", "quiz": {"item": "c4-cert", "content": "causal", "q1": {"kind": "find", "text": "What does the certificate prove?", "options": ["That traffic is compressed", "That the server is who it claims to be", "That your password is strong", "That the connection is fast"], "answer": 1}, "q2": {"kind": "understand", "text": "An attacker's server encrypts traffic but has no valid certificate for your bank's domain. What protects you?", "options": ["The encryption alone", "The browser's check that the certificate matches the domain", "Your antivirus", "Nothing protects you"], "answer": 1}, "review": {"author_check": "both formats carry the same claims (2026-11-12)", "independent_check": "pending"}}}, {"id": "p1-query", "lang": "en", "content": "parallel", "question": "What can I do to speed up a slow database query?", "prose": "You can add an index on the columns you filter by, which lets the database skip most rows. You can select only the columns you need instead of SELECT *. You can add a LIMIT if you only show the first page. And you can cache the result if the data changes rarely.", "bullets": "- Add an index on the columns you filter by (skips most rows)\n- Select only the columns you need, not SELECT *\n- Add a LIMIT if you only show the first page\n- Cache the result if the data changes rarely", "quiz": {"item": "p1-query", "content": "parallel", "q1": {"kind": "find", "text": "Which option helps when you only show the first page?", "options": ["An index", "Selecting fewer columns", "A LIMIT", "Caching"], "answer": 2}, "q2": {"kind": "understand", "text": "Your data changes every second. Which option is the weakest fit?", "options": ["An index", "Selecting fewer columns", "A LIMIT", "Caching the result"], "answer": 3}, "review": {"author_check": "both formats carry the same claims (2026-11-12)", "independent_check": "pending"}}}, {"id": "p2-git", "lang": "en", "content": "parallel", "question": "What are the basic git commands I need every day?", "prose": "You use git status to see what changed, git add to stage the files you want to commit, git commit -m \"message\" to save a snapshot, and git push to send your commits to the shared repository. Before you start work, git pull brings in your teammates' changes.", "bullets": "- git status: see what changed\n- git add: stage files for the commit\n- git commit -m \"message\": save a snapshot\n- git push: send commits to the shared repo\n- git pull: bring in teammates' changes before you start", "quiz": {"item": "p2-git", "content": "parallel", "q1": {"kind": "find", "text": "Which command sends your commits to the shared repository?", "options": ["git status", "git add", "git push", "git pull"], "answer": 2}, "q2": {"kind": "understand", "text": "You edited a file but git commit says there is nothing to commit. Which step did you most likely skip?", "options": ["git push", "git add", "git pull", "git status"], "answer": 1}, "review": {"author_check": "both formats carry the same claims (2026-11-12)", "independent_check": "pending"}}}, {"id": "p3-pack", "lang": "en", "content": "parallel", "question": "What should I check before deploying to production?", "prose": "Check that all tests pass on the main branch. Check that database migrations have been reviewed. Check that you have a rollback plan, such as the previous release tag. And check that monitoring alerts are on so you'll notice errors quickly.", "bullets": "- All tests pass on the main branch\n- Database migrations are reviewed\n- A rollback plan exists (e.g. the previous release tag)\n- Monitoring alerts are on so errors are noticed quickly", "quiz": {"item": "p3-pack", "content": "parallel", "q1": {"kind": "find", "text": "What example of a rollback plan does the answer give?", "options": ["A database backup", "The previous release tag", "A feature flag", "A maintenance page"], "answer": 1}, "q2": {"kind": "understand", "text": "Errors appear after the deploy, but nobody notices for an hour. Which check was most likely skipped?", "options": ["Tests passing", "Migration review", "Rollback plan", "Monitoring alerts"], "answer": 3}, "review": {"author_check": "both formats carry the same claims (2026-11-12)", "independent_check": "pending"}}}, {"id": "p4-passwords", "lang": "en", "content": "parallel", "question": "How do I make my accounts more secure?", "prose": "Use a password manager so every site gets a different password. Turn on two-factor authentication for email and banking first. Update your phone and laptop when updates arrive. And don't reuse a password that has appeared in a breach.", "bullets": "- Use a password manager: a different password for every site\n- Turn on two-factor authentication, email and banking first\n- Install phone and laptop updates when they arrive\n- Never reuse a password that appeared in a breach", "quiz": {"item": "p4-passwords", "content": "parallel", "q1": {"kind": "find", "text": "Which accounts does the answer say to protect with two-factor authentication first?", "options": ["Social media", "Email and banking", "Shopping", "Work chat"], "answer": 1}, "q2": {"kind": "understand", "text": "One site you use is breached. Which habit limits the damage to only that site?", "options": ["Installing updates", "A different password for every site", "Two-factor on email", "Logging out"], "answer": 1}, "review": {"author_check": "both formats carry the same claims (2026-11-12)", "independent_check": "pending"}}}], "items_sha": "20dbab276572dde2"};
const REPO = "https://github.com/wonjangcloud9/brainres";
const T = {
  en: { title:"How easy is this answer to understand?", intro:"You'll read short answers to technical questions and answer a few questions about each. It takes about 10 minutes. We record only your choices and timings, with a random ID. Nothing else.",
        fluent:"I read this language fluently", start:"Start", next:"Next", read:"Question", q1:"You can look at the answer while you choose.", q2:"The answer is hidden now. Answer from what you remember and understood.",
        conf:"How confident are you? (1 = guessing, 5 = certain)", pref:"Which of these two answers is easier to understand?", left:"Left one", right:"Right one", same:"About the same",
        done:"Thank you! Please submit your result:", dl:"Download result (.json)", copy:"Copy result", issue:"Open the submission form on GitHub", attn:"Attention check: please select the option that says “Blue”." },
  ko: { title:"이 답은 얼마나 이해하기 쉬운가요?", intro:"기술 질문에 대한 짧은 답을 읽고, 각 답마다 질문 몇 개에 답합니다. 약 10분 걸립니다. 무작위 ID와 선택·응답 시간만 기록하고, 그 밖의 정보는 남기지 않습니다.",
        fluent:"이 언어로 된 글을 편하게 읽을 수 있어요", start:"시작", next:"다음", read:"질문", q1:"답을 보면서 고르세요.", q2:"이제 답이 가려졌어요. 읽고 이해한 내용으로 답하세요.",
        conf:"얼마나 확신하나요? (1 = 찍음, 5 = 확실)", pref:"두 답 중 어느 쪽이 더 이해하기 쉬운가요?", left:"왼쪽", right:"오른쪽", same:"비슷함",
        done:"감사합니다! 결과를 제출해 주세요.", dl:"결과 다운로드 (.json)", copy:"결과 복사", issue:"GitHub 제출 양식 열기", attn:"주의력 확인: “Blue”라고 적힌 선택지를 고르세요." }
};
const app = document.getElementById("app");
const rid = () => Math.random().toString(36).slice(2, 10);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const md = s => (window.marked ? marked.parse(s) : "<pre>" + s.replace(/</g, "&lt;") + "</pre>");
const STUDY = DATA.study || 1, VERSIONS = DATA.versions || ["baseline", "brainres"];
let S = { id: rid(), study: STUDY, started: new Date().toISOString(), ua: navigator.userAgent.slice(0, 120), lang: null, fluent: null, list: Math.random() < 0.5 ? "A" : "B", trials: [], attention: null, preference: [] };
let L = T.en;

function view(html) { app.innerHTML = html; window.scrollTo(0, 0); }
function radio(name, opts) { return opts.map((o, i) => `<label class="opt"><input type="radio" name="${name}" value="${i}">${o}</label>`).join(""); }
function scale(name) { return `<div class="scale">${[1,2,3,4,5].map(v => `<label><input type="radio" name="${name}" value="${v}"> ${v}</label>`).join("")}</div>`; }
function picked(name) { const el = document.querySelector(`input[name="${name}"]:checked`); return el ? Number(el.value) : null; }
function waitFor(names, btn) { const b = document.getElementById(btn); const f = () => { b.disabled = !names.every(n => picked(n) !== null); }; document.querySelectorAll("input").forEach(i => i.addEventListener("change", f)); f(); }

function intro() {
  view(`<h1>${T.en.title}<br><span class="muted">${T.ko.title}</span></h1>
  <div class="card"><p>${T.en.intro}</p><p class="muted">${T.ko.intro}</p>
  <p>${["en", "ko"].filter(l => DATA.items.some(it => it.lang === l)).map(l => `<button onclick="pickLang('${l}')">${l === "en" ? "English set" : "한국어 세트"} (${DATA.items.filter(it => it.lang === l).length})</button>`).join(" ")}</p></div>`);
}
function pickLang(lang) {
  S.lang = lang; L = T[lang];
  view(`<div class="card"><label class="opt"><input type="checkbox" id="fl"> ${L.fluent}</label><p><button class="primary" onclick="begin()">${L.start}</button></p></div>`);
}
function begin() {
  S.fluent = document.getElementById("fl").checked;
  const items = shuffle(DATA.items.filter(it => it.lang === S.lang));
  // Counterbalancing: within each content group (study 2: causal / parallel), items sorted by id get
  // alternating versions; list B flips them. Study 1 has one group, so this is the original scheme.
  const group = it => it.content || "all";
  const order = g => DATA.items.filter(it => it.lang === S.lang && group(it) === g).map(it => it.id).sort();
  S.plan = items.map(it => { const k = order(group(it)).indexOf(it.id) % 2 === 0; const second = (S.list === "A") ? k : !k; return { id: it.id, content: it.content, version: VERSIONS[second ? 1 : 0] }; });
  S.attnAt = 1 + Math.floor(Math.random() * Math.max(1, S.plan.length - 1));
  S.step = 0; trial();
}
function progress() { const n = S.plan.length; return `<div class="progress"><div style="width:${Math.round(100 * S.step / n)}%"></div></div>`; }
function trial() {
  if (S.step === S.attnAt && S.attention === null) return attention();
  if (S.step >= S.plan.length) return DATA.preference === false ? finish() : preference();
  const p = S.plan[S.step], it = DATA.items.find(x => x.id === p.id), quiz = it.quiz, opts1 = shuffle(quiz.q1.options.map((o, i) => [o, i]));
  view(`${progress()}<div class="card"><div class="muted">${L.read}</div><div class="q">${it.question}</div></div>
  <div class="card answer">${md(it[p.version])}</div>
  <div class="card"><div class="q">${quiz.q1.text}</div><div class="muted">${L.q1}</div>${radio("q1", opts1.map(o => o[0]))}<p>${L.conf}</p>${scale("c1")}<p><button class="primary" id="b1">${L.next}</button></p></div>`);
  const t0 = performance.now(); waitFor(["q1", "c1"], "b1");
  document.getElementById("b1").onclick = () => { const choice = opts1[picked("q1")][1]; const rec = { id: p.id, content: p.content, version: p.version, q1: { correct: choice === quiz.q1.answer, ms: Math.round(performance.now() - t0), conf: picked("c1") } }; q2(it, rec); };
}
function q2(it, rec) {
  const quiz = it.quiz, opts2 = shuffle(quiz.q2.options.map((o, i) => [o, i]));
  view(`${progress()}<div class="card"><div class="q">${quiz.q2.text}</div><div class="muted">${L.q2}</div>${radio("q2", opts2.map(o => o[0]))}<p>${L.conf}</p>${scale("c2")}<p><button class="primary" id="b2">${L.next}</button></p></div>`);
  const t0 = performance.now(); waitFor(["q2", "c2"], "b2");
  document.getElementById("b2").onclick = () => { const choice = opts2[picked("q2")][1]; rec.q2 = { correct: choice === quiz.q2.answer, ms: Math.round(performance.now() - t0), conf: picked("c2") }; S.trials.push(rec); S.step++; trial(); };
}
function attention() {
  const opts = shuffle(["Red", "Blue", "Green", "Yellow"]);
  view(`${progress()}<div class="card"><div class="q">${L.attn}</div>${radio("at", opts)}<p><button class="primary" id="ba">${L.next}</button></p></div>`);
  waitFor(["at"], "ba");
  document.getElementById("ba").onclick = () => { S.attention = opts[picked("at")] === "Blue"; trial(); };
}
function preference() {
  const pool = shuffle(DATA.items.filter(it => it.lang === S.lang)).slice(0, 2);
  const show = (k) => {
    if (k >= pool.length) return finish();
    const it = pool[k], leftIsBrainres = Math.random() < 0.5;
    const L1 = leftIsBrainres ? it.brainres : it.baseline, R1 = leftIsBrainres ? it.baseline : it.brainres;
    view(`<div class="card"><div class="muted">${L.read}</div><div class="q">${it.question}</div></div>
    <div class="two"><div class="card answer">${md(L1)}</div><div class="card answer">${md(R1)}</div></div>
    <div class="card"><div class="q">${L.pref}</div>${radio("pf", [L.left, L.right, L.same])}<p><button class="primary" id="bp">${L.next}</button></p></div>`);
    waitFor(["pf"], "bp");
    document.getElementById("bp").onclick = () => { const v = picked("pf"); S.preference.push({ id: it.id, choice: v === 2 ? "same" : ((v === 0) === leftIsBrainres ? "brainres" : "baseline") }); show(k + 1); };
  };
  show(0);
}
function finish() {
  S.finished = new Date().toISOString(); S.items_sha = DATA.items_sha; delete S.step; delete S.attnAt;
  const json = JSON.stringify(S, null, 1);
  view(`<div class="card"><h2>${L.done}</h2>
  <p><button class="primary" id="dl">${L.dl}</button> <button id="cp">${L.copy}</button></p>
  <p><a href="${REPO}/issues/new?template=benchmark-result.yml&title=${encodeURIComponent(`Benchmark result (study ${STUDY})`)}" target="_blank" rel="noopener">${L.issue} →</a></p>
  <textarea readonly>${json.replace(/</g, "&lt;")}</textarea></div>`);
  document.getElementById("dl").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([json], { type: "application/json" })); a.download = `brainres-bench${STUDY === 1 ? "" : STUDY}-${S.id}.json`; a.click(); };
  document.getElementById("cp").onclick = () => { try { navigator.clipboard.writeText(json); } catch (e) {} };
}
// #autotest: click through the whole study with the first options (used by validate.sh via headless Chrome)
function autotest() {
  const tick = () => {
    const btns = [...document.querySelectorAll("button")];
    const lang = btns.find(b => b.textContent.startsWith("English set"));
    if (lang) { lang.click(); return setTimeout(tick, 0); }
    const fl = document.getElementById("fl"); if (fl) { fl.checked = true; begin(); return setTimeout(tick, 0); }
    const ta = document.querySelector("textarea"); if (ta) { document.title = "AUTOTEST_DONE"; return; }
    ["q1","c1","q2","c2","at","pf"].forEach(n => { const r = document.querySelector(`input[name="${n}"]`); if (r) { r.checked = true; r.dispatchEvent(new Event("change")); } });
    const next = document.querySelector("button.primary"); if (next) next.click();
    setTimeout(tick, 0);
  };
  setTimeout(tick, 0);
}
intro();
if (location.hash === "#autotest") autotest();
</script>
</body>
</html>
