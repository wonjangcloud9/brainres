<style>
  :root { --bg:#fbfaf8; --fg:#1d1c1a; --muted:#6b6862; --card:#ffffff; --line:#e4e1db; --accent:#2f6f4f; --warn:#9a3b2b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14151a; --fg:#e9e7e3; --muted:#a19d96; --card:#1c1e25; --line:#2c2f39; --accent:#7ee2a8; --warn:#f0a36b; } }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.55 -apple-system,"Segoe UI","Apple SD Gothic Neo",sans-serif }
  main { max-width:760px; margin:0 auto; padding:24px 16px 64px }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin:16px 0 }
  .q { font-weight:600 }
  .muted { color:var(--muted); font-size:15px }
  button { font:inherit; padding:10px 16px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent) }
  @media (prefers-color-scheme: dark) { button.primary { color:#0f1117 } }
  button:disabled { opacity:.45; cursor:not-allowed }
  label.opt { display:block; padding:10px 12px; border:1px solid var(--line); border-radius:8px; margin:8px 0; cursor:pointer }
  label.opt input { margin-right:8px }
  .answer table { border-collapse:collapse; width:100%; font-size:15px; display:block; overflow-x:auto }
  .answer th, .answer td { border:1px solid var(--line); padding:6px 8px; text-align:left }
  .answer pre { background:rgba(127,127,127,.12); padding:10px; border-radius:8px; overflow-x:auto }
  .answer code { font-size:14px }
  .scale { display:flex; gap:8px; flex-wrap:wrap } .scale label { border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer }
  .two { display:grid; grid-template-columns:1fr; gap:12px } @media (min-width:900px){ main{max-width:1100px} .two{grid-template-columns:1fr 1fr} }
  textarea { width:100%; height:160px; font:13px/1.4 ui-monospace,monospace; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:8px }
  .progress { height:4px; background:var(--line); border-radius:2px; overflow:hidden } .progress div { height:100%; background:var(--accent) }
</style>

<script>
const DATA = {"items": [{"id": "01-debug", "lang": "en", "question": "My Python script says ModuleNotFoundError: No module named 'requests'. Why?", "baseline": "`requests` isn't a standard library module, so it has to be installed separately, and the Python interpreter running your script doesn't have it. The usual causes:\n\n1. **It was never installed.** Fix: `python3 -m pip install requests`\n2. **It's installed for a different Python.** Common on macOS, where `pip` may point at one interpreter (Homebrew, system, pyenv, conda) and `python`/`python3` at another. Using `python3 -m pip install ...` guarantees the package goes to the same interpreter you run.\n3. **You're in (or out of) a virtual environment.** If you installed it globally but run the script inside a venv (or the reverse), the venv can't see it. Activate the right one with `source .venv/bin/activate`, then install.\n4. **Your editor/IDE uses a different interpreter** than your terminal. Check the selected interpreter in VS Code or PyCharm.\n5. **A local file named `requests.py`** (or a `requests/` folder) in your project can shadow the real package. That usually causes a different error (missing attributes), but it's worth checking.\n\nTo diagnose, run these in the same way you run your script:\n\n```\nwhich python3\npython3 -c \"import sys; print(sys.executable)\"\npython3 -m pip --version\npython3 -m pip show requests\n```\n\nIf `pip show` prints nothing, it isn't installed for that interpreter. If the paths differ between `pip` and `python3`, that's the mismatch.\n\nIf you'd like, I can run these checks here and look at your script and environment to pinpoint which case it is.", "brainres": "Because the Python interpreter running your script doesn't have `requests` installed, which is almost always a mismatch between the `pip` you installed it with and the `python` you run.\n\nOn macOS this is common: `pip` may point to one Python (Homebrew, system, or a venv) while `python3` points to another.\n\n**Fix, in order:**\n\n1. Check which interpreter runs your script: `python3 -c \"import sys; print(sys.executable)\"`\n2. Install into that exact interpreter: `python3 -m pip install requests`\n3. Verify: `python3 -c \"import requests; print(requests.__version__)\"`\n\nUsing `python3 -m pip` instead of bare `pip` guarantees the install goes where the script looks.\n\nIf step 2 fails with `externally-managed-environment` (~80% likely on Homebrew Python), create a virtual environment instead:\n\n```\npython3 -m venv .venv\nsource .venv/bin/activate\npip install requests\npython script.py\n```\n\nIf you run the script from an IDE, also check that its selected interpreter matches the one in step 1.\n\nRun step 1 and tell me the path it prints if the error persists.", "quiz": {"item": "01-debug", "q1": {"kind": "find", "text": "Which command installs requests into the same Python that runs your script?", "options": ["pip install requests --global", "python3 -m pip install requests", "brew install requests", "python3 install requests"], "answer": 1}, "q2": {"kind": "understand", "text": "Why can installing requests succeed while the script still fails?", "options": ["The install went into a different Python than the one running the script", "pip only takes effect after you open a new terminal", "requests only works inside Docker", "Python caches failed imports forever"], "answer": 0}, "review": {"author_check": "answer supported by both versions (2026-11-12)", "independent_check": "LLM reviewer 2026-11-12: 22 PASS / 2 FIX (07 q1 giveaway, 08 q1 contradicted by baseline) — fixed; wording-bias and giveaway rewrites applied; human reviewer still recommended before launch"}}}, {"id": "02-concept", "lang": "en", "question": "What is a race condition?", "baseline": "A **race condition** is a bug where a program's behavior depends on the timing or ordering of events that aren't controlled, typically when multiple threads, processes, or requests access shared state at the same time and at least one modifies it.\n\n**Classic example:** two threads increment a shared counter.\n\n```\ncounter = 0\n\nThread A: read counter (0)\nThread B: read counter (0)\nThread A: write counter = 1\nThread B: write counter = 1   # expected 2, got 1\n```\n\n`counter += 1` looks atomic but is really read, modify, write. If the steps interleave, one update is lost.\n\n**Common forms:**\n- **Read-modify-write:** lost updates, as above.\n- **Check-then-act (TOCTOU):** you check a condition (file exists, balance sufficient) and act on it, but the state changes in between.\n- **Data race:** unsynchronized concurrent access to memory where at least one access is a write. In languages like C/C++ this is undefined behavior.\n- **Ordering issues:** code assumes event X happens before Y, but nothing enforces it.\n\n**Why they're nasty:** they're nondeterministic. They may appear only under load, on certain hardware, or once in a million runs, and adding logging or a debugger can make them vanish.\n\n**Typical fixes:**\n- **Mutual exclusion:** locks/mutexes around critical sections.\n- **Atomic operations:** atomic increments, compare-and-swap.\n- **Immutability / avoiding shared state:** message passing, thread-local data.\n- **Database-level protection:** transactions, row locks, unique constraints, optimistic concurrency (version columns).\n- **Idempotency:** so retries or duplicate requests don't cause double effects.\n\n**Detection tools:** ThreadSanitizer (C/C++/Go/Rust), `go test -race`, Helgrind, Java's `jcstress`, and stress testing with many iterations.\n\n**Security angle:** race conditions can be exploitable, for example double-spending a coupon by sending parallel requests, or swapping a file between a permission check and its use (TOCTOU).\n\nIf you have a specific language or code snippet in mind, I can show a concrete example and fix.", "brainres": "A race condition is a bug where a program's result depends on the timing or order of concurrent operations, so the same code can give different results from run to run.\n\nIt happens when two or more threads or processes access shared data, at least one writes, and nothing forces them into a safe order.\n\n**Example:** two threads each run `counter += 1` on a shared counter that starts at 0.\n\n1. Thread A reads `counter` (0).\n2. Thread B reads `counter` (0).\n3. Thread A writes 1.\n4. Thread B writes 1.\n\nThe final value is 1, not 2, because `counter += 1` is really three steps (read, add, write) and the threads interleaved between them.\n\n**Common fixes:**\n\n| Fix | How it helps |\n|---|---|\n| Lock or mutex | Only one thread runs the critical section at a time |\n| Atomic operations | The read-modify-write happens as one indivisible step |\n| Immutable data or message passing | Nothing shared gets mutated |\n| Database transactions | The database serializes conflicting updates |\n\nRace conditions are hard to debug because they often vanish under a debugger or logging, which changes the timing. Tools like ThreadSanitizer (`-fsanitize=thread` in clang/gcc) or Go's `-race` flag can detect them.\n\nIf you have code you suspect has one, paste it or point me to the file and I'll look.", "quiz": {"item": "02-concept", "q1": {"kind": "find", "text": "In the shared-counter example, what final value does the interleaving shown produce?", "options": ["0", "1", "2", "3"], "answer": 1}, "q2": {"kind": "understand", "text": "Which change would prevent the lost update?", "options": ["Adding logging around the increment", "Running it under a debugger", "Using a lock or an atomic increment", "Running it on faster hardware"], "answer": 2}, "review": {"author_check": "answer supported by both versions (2026-11-12)", "independent_check": "LLM reviewer 2026-11-12: 22 PASS / 2 FIX (07 q1 giveaway, 08 q1 contradicted by baseline) — fixed; wording-bias and giveaway rewrites applied; human reviewer still recommended before launch"}}}, {"id": "03-decision", "lang": "en", "question": "Should I use REST or GraphQL for a small internal API used by one frontend?", "baseline": "**Use REST.** For one internal frontend with a small API, it's the lower-overhead choice.\n\n**Why REST fits here:**\n- You control both sides, so you can shape endpoints to exactly what the UI needs (including purpose-built \"view\" endpoints that return what a screen needs in one call).\n- No extra schema, resolver, or client-library layer to build and maintain.\n- Caching, logging, debugging, and auth all work with standard HTTP tooling.\n- Less to learn and less to go wrong for a small team.\n\n**When GraphQL would be worth it:**\n- Many screens with very different data shapes, causing lots of over-fetching or round trips.\n- Deeply nested, relational data the UI traverses in varied ways.\n- You expect more clients (mobile, third parties) soon, each wanting different fields.\n- Your team already knows GraphQL well and has the tooling set up.\n\n**Tips to get GraphQL-like benefits with REST:**\n- Add optional `?fields=` or `?include=` params only if you actually hit over-fetching.\n- Define the API with OpenAPI and generate typed client code for the frontend.\n- Make a few aggregate endpoints for screens that would otherwise need several calls.\n\nIf you later outgrow REST, you can put GraphQL in front of the same services without a rewrite.", "brainres": "Use REST. For one frontend and one team, GraphQL's main benefits (many clients with different data needs, avoiding over-fetching across a public surface) don't apply, while its costs do: a schema layer, resolvers, N+1 handling, query-complexity limits, and a heavier client setup.\n\n**Strongest case for GraphQL:** if the frontend has deeply nested, highly variable views (say, dashboards that join 5+ entities differently per screen), you'll otherwise write many bespoke endpoints or make many round trips. If that describes your app, GraphQL starts to pay off. Roughly 80% of small internal tools don't look like that.\n\n**How to keep REST pleasant:**\n1. Shape endpoints around screens when needed, e.g. `GET /dashboard` returning exactly what that page uses. Internal APIs don't need purity.\n2. Add an `?include=` or `?fields=` param only if over-fetching actually shows up.\n3. Generate types from an OpenAPI spec (or use tRPC if frontend and backend are both TypeScript) to get the type safety people often want from GraphQL.\n\n**Next action:** list your frontend's 3-5 most complex screens and count the distinct entities each needs. If most need 1-2 endpoints, go REST; if several need 4+ with varying shapes, prototype one in GraphQL before committing.", "quiz": {"item": "03-decision", "q1": {"kind": "find", "text": "Which does the answer recommend for this API?", "options": ["REST", "GraphQL", "Both at once", "Neither"], "answer": 0}, "q2": {"kind": "understand", "text": "Which situation would make GraphQL worth it instead?", "options": ["A single simple screen", "Many screens with deeply nested, varied data needs", "A very small team", "Wanting standard HTTP caching"], "answer": 1}, "review": {"author_check": "answer supported by both versions (2026-11-12)", "independent_check": "LLM reviewer 2026-11-12: 22 PASS / 2 FIX (07 q1 giveaway, 08 q1 contradicted by baseline) — fixed; wording-bias and giveaway rewrites applied; human reviewer still recommended before launch"}}}, {"id": "04-yesno", "lang": "en", "question": "Is 0.1 + 0.2 === 0.3 true in JavaScript?", "baseline": "No, it evaluates to `false`.\n\nJavaScript uses IEEE 754 double-precision floats, and neither 0.1 nor 0.2 can be represented exactly in binary. Their sum comes out as:\n\n```js\n0.1 + 0.2        // 0.30000000000000004\n0.1 + 0.2 === 0.3 // false\n```\n\nTo compare floats, use a tolerance:\n\n```js\nMath.abs(0.1 + 0.2 - 0.3) < Number.EPSILON  // true\n```\n\nFor money or other cases needing exact decimals, work in integer units (e.g. cents) or use a decimal library.", "brainres": "No, `0.1 + 0.2 === 0.3` is `false` in JavaScript. `0.1 + 0.2` evaluates to `0.30000000000000004`.\n\nJavaScript numbers are 64-bit binary floats, and 0.1 and 0.2 have no exact binary representation. Each is stored as a slightly rounded value, and the rounding errors add up to a result that differs from the rounded value of 0.3.\n\nTo compare floats, check that the difference is within a small tolerance:\n\n```js\nMath.abs(0.1 + 0.2 - 0.3) < Number.EPSILON  // true\n```\n\n`Number.EPSILON` (~2.22e-16) works for values near 1. For larger magnitudes, scale the tolerance, or work in integers (for example, cents instead of dollars).", "quiz": {"item": "04-yesno", "q1": {"kind": "find", "text": "What does 0.1 + 0.2 evaluate to in JavaScript?", "options": ["0.3", "0.30000000000000004", "0.29999999999999998", "NaN"], "answer": 1}, "q2": {"kind": "understand", "text": "How should you compare two floating-point results?", "options": ["With ===", "Treat them as equal if they differ by less than a tiny margin", "Convert both to strings first", "Round both to one decimal place"], "answer": 1}, "review": {"author_check": "answer supported by both versions (2026-11-12)", "independent_check": "LLM reviewer 2026-11-12: 22 PASS / 2 FIX (07 q1 giveaway, 08 q1 contradicted by baseline) — fixed; wording-bias and giveaway rewrites applied; human reviewer still recommended before launch"}}}, {"id": "05-numbers", "lang": "en", "question": "A test for a disease is 99% accurate and 1 in 1,000 people have it. I tested positive. How likely is it that I actually have it?", "baseline": "**About 9%**, assuming \"99% accurate\" means the test has 99% sensitivity (catches 99% of true cases) and 99% specificity (correctly clears 99% of healthy people).\n\nTake 100,000 people:\n\n- **Have the disease:** 100 (1 in 1,000)\n  - Test positive: 99\n- **Don't have it:** 99,900\n  - False positives (1%): about 999\n\nTotal positives ≈ 99 + 999 = 1,098. Of those, 99 are real.\n\n99 / 1,098 ≈ **9%**\n\nThe disease is so rare that the 1% false-positive rate applied to the huge healthy group produces roughly 10 times more false positives than there are true cases.\n\nPractical takeaways:\n\n- A positive result is a reason for a confirmatory test, not a diagnosis.\n- The answer depends on your prior risk. If you have symptoms or risk factors that put you in a higher-risk group than 1 in 1,000, the probability goes up substantially.\n- If \"99% accurate\" means something different for this specific test (e.g., different sensitivity and specificity), the number shifts. Your doctor can tell you the actual figures.", "brainres": "About 9%, not 99%, assuming \"99% accurate\" means 99% sensitivity and 99% specificity (~85% sure that's the intended reading; the answer changes if the test's accuracy is defined differently).\n\nHere is the worked example with 100,000 people:\n\n- 100 have the disease. The test catches 99 of them (true positives).\n- 99,900 don't have it. The test wrongly flags 1% of them, which is 999 (false positives).\n- Total positives: 99 + 999 = 1,098.\n- Chance you're truly sick given a positive: 99 / 1,098 ≈ **9%**.\n\nThe reason is the base rate. The disease is so rare that false positives from the huge healthy group outnumber true positives from the tiny sick group, roughly 10 to 1.\n\nNext step: a second, independent test. If it's also positive, the odds jump to about 91%, because the first result raises your prior from 0.1% to 9%.", "quiz": {"item": "05-numbers", "q1": {"kind": "find", "text": "Roughly how likely is it that you actually have the disease?", "options": ["About 99%", "About 50%", "About 9%", "About 0.1%"], "answer": 2}, "q2": {"kind": "understand", "text": "Why is it so much lower than the test's 99% accuracy?", "options": ["The test is defective", "False positives from the many healthy people outnumber the true positives", "Most people misread their results", "The disease is contagious"], "answer": 1}, "review": {"author_check": "answer supported by both versions (2026-11-12)", "independent_check": "LLM reviewer 2026-11-12: 22 PASS / 2 FIX (07 q1 giveaway, 08 q1 contradicted by baseline) — fixed; wording-bias and giveaway rewrites applied; human reviewer still recommended before launch"}}}, {"id": "06-procedure", "lang": "en", "question": "How do I undo my last git commit but keep the changes?", "baseline": "Run:\n\n```bash\ngit reset --soft HEAD~1\n```\n\nThis removes the last commit but leaves all its changes staged, so you can edit and recommit.\n\nVariants:\n\n- **Keep changes unstaged:** `git reset HEAD~1` (the default `--mixed`)\n- **Discard the changes entirely:** `git reset --hard HEAD~1` (destructive, so avoid it if you want to keep your work)\n\nIf you've already pushed the commit, resetting rewrites history. You'd need `git push --force-with-lease` afterward, which can affect collaborators. In that case, `git revert HEAD` is safer because it adds a new commit that undoes the change without rewriting history.\n\nNote that the current working directory isn't a git repository, so run these in your actual project folder.", "brainres": "Run `git reset --soft HEAD~1`. This removes the commit and leaves your changes staged.\n\nPick the variant by where you want the changes to end up:\n\n| Command | Changes end up |\n|---|---|\n| `git reset --soft HEAD~1` | Staged, ready to commit again |\n| `git reset HEAD~1` (same as `--mixed`) | In your working tree, unstaged |\n\nAvoid `--hard`, because it **discards** the changes.\n\nIf you already pushed the commit, resetting only changes your local branch. Pushing afterward needs `git push --force-with-lease`, and that rewrites shared history. On a shared branch, use `git revert HEAD` instead, which adds a new commit that undoes the old one.\n\nNote that the current directory (`/private/var/folders/.../tmpecdnb6mu`) isn't a git repository, so run the command from inside your project folder.\n\nIf you tell me which variant you want and where the repo is, I can run it for you.", "quiz": {"item": "06-procedure", "q1": {"kind": "find", "text": "Which command undoes the last commit and keeps its changes staged?", "options": ["git reset --hard HEAD~1", "git reset --soft HEAD~1", "git revert --keep", "git checkout HEAD~1"], "answer": 1}, "q2": {"kind": "understand", "text": "You already pushed the commit and teammates use that branch. What is the safer option?", "options": ["git reset --hard HEAD~1", "git revert HEAD", "Delete the branch", "git reset --soft HEAD~1, then push normally"], "answer": 1}, "review": {"author_check": "answer supported by both versions (2026-11-12)", "independent_check": "LLM reviewer 2026-11-12: 22 PASS / 2 FIX (07 q1 giveaway, 08 q1 contradicted by baseline) — fixed; wording-bias and giveaway rewrites applied; human reviewer still recommended before launch"}}}, {"id": "07-myth", "lang": "en", "question": "Humans only use 10% of their brains, right?", "baseline": "No, that's a myth. Humans use virtually all of their brain, just not all regions at the same moment.\n\n- **Imaging evidence:** fMRI and PET scans show activity across the whole brain over the course of a day, including during sleep. No large region is permanently dormant.\n- **Damage evidence:** If 90% of the brain were unused, damage to most areas would have no effect. In reality, even small lesions often cause noticeable deficits in movement, language, memory, or perception.\n- **Energy cost:** The brain is about 2% of body weight but uses roughly 20% of the body's energy. Evolution wouldn't maintain such an expensive organ if 90% of it were idle.\n- **Neuron-level evidence:** Unused neurons tend to degenerate or get pruned, so there's no big reserve of idle ones.\n\n**Where the myth may come from:** Possibly misquoted early psychologists (like William James, who said people use only a fraction of their *potential*), misinterpretations of early neuroscience, or the fact that glial cells outnumber neurons, which was wrongly taken to mean most of the brain was \"inactive.\"\n\nIt's true that at any given moment only a fraction of neurons are firing, and that people can improve skills through learning. But that's not the same as having 90% of your brain sitting unused.", "brainres": "No, that's a myth. Humans use virtually all of their brain, just not all of it at the same moment.\n\nBrain imaging (fMRI, PET) shows activity across every region over the course of a day, even during sleep. Damage to almost any area causes some deficit, which wouldn't happen if 90% were idle. The brain is also about 2% of body weight but uses ~20% of the body's energy, and evolution wouldn't maintain such an expensive organ if most of it did nothing.\n\nThe myth likely comes from misquoted early neuroscience and self-help claims about \"untapped potential.\" At any given moment, only a fraction of neurons fire, which is a good thing, since too many firing at once is what happens in a seizure.\n\nIf you want to check this yourself, search for \"brain imaging whole-brain activity\" or read a neuroscience overview like the one from Scientific American on the 10% myth.", "quiz": {"item": "07-myth", "q1": {"kind": "find", "text": "According to the answer, roughly what share of the body's energy does the brain use?", "options": ["About 2%", "About 10%", "About 20%", "About 50%"], "answer": 2}, "q2": {"kind": "understand", "text": "Which observation argues against the 10% claim?", "options": ["Injury to nearly any brain region produces some impairment", "Brain scans show large regions stay dormant all day", "All neurons fire at the same moment", "IQ tests use about 10% of the brain"], "answer": 0}, "review": {"author_check": "answer supported by both versions (2026-11-12)", "independent_check": "LLM reviewer 2026-11-12: 22 PASS / 2 FIX (07 q1 giveaway, 08 q1 contradicted by baseline) — fixed; wording-bias and giveaway rewrites applied; human reviewer still recommended before launch"}}}, {"id": "08-explain", "lang": "en", "question": "Explain how HTTPS keeps my password safe.", "baseline": "HTTPS wraps your HTTP traffic in TLS (Transport Layer Security). Here's how that protects a password you type into a login form.\n\n## 1. Authenticating the server (certificates)\nWhen your browser connects, the server presents a **certificate** that says \"I am example.com,\" signed by a Certificate Authority (CA) your device already trusts. The browser verifies:\n- The signature chains up to a trusted root CA\n- The domain name matches\n- The certificate hasn't expired or been revoked\n\nThis stops an attacker from impersonating the site and collecting your password.\n\n## 2. Agreeing on a secret key (handshake)\nBrowser and server use a key exchange (modern TLS uses ephemeral Diffie-Hellman, e.g. X25519) to derive a shared secret **without ever sending it over the wire**. An eavesdropper watching the entire handshake still can't compute it. The server proves it owns the certificate by signing handshake data with its private key.\n\nBecause the keys are ephemeral, recording traffic today and stealing the server's key later doesn't let anyone decrypt it (**forward secrecy**).\n\n## 3. Encrypting everything\nOnce the shared key exists, all data, including the URL path, headers, cookies, and your POSTed password, is encrypted with a symmetric cipher such as AES-GCM or ChaCha20-Poly1305. These also include an **authentication tag**, so any tampering in transit is detected.\n\n## What an attacker on the network sees\nSomeone on the same Wi-Fi or at your ISP can see the destination domain (via DNS/SNI) and traffic volume, but not the password, page content, or cookies.\n\n## What HTTPS does *not* protect against\n- **Phishing**: a lookalike domain can have a perfectly valid certificate. Check the URL.\n- **Malware or malicious extensions** on your device that read input before encryption.\n- **A compromised or careless server**: HTTPS protects the password in transit only. Once it arrives, the site must store it safely (salted, slow hashes like bcrypt/argon2).\n- **Weak or reused passwords**: use a password manager and 2FA.\n- **Rogue root CAs** installed on your device (e.g. by corporate proxies or malware) can allow interception.\n\nIn short: HTTPS ensures you're talking to the real server, that nobody can read your password in transit, and that nobody can alter it along the way.", "brainres": "HTTPS keeps your password safe by encrypting it before it leaves your browser, so anyone watching the network (Wi-Fi owners, ISPs, attackers on the same café network) sees only scrambled bytes instead of the password.\n\nIt does this in three steps:\n\n1. **Identity check.** The server sends a certificate, signed by a certificate authority your browser already trusts. Your browser verifies that the certificate matches the domain you typed, so you are talking to the real site and not an impostor.\n2. **Key agreement.** Your browser and the server run a key exchange (TLS uses Diffie-Hellman variants). Both sides end up with the same secret session key, but that key never travels over the network, so an eavesdropper cannot reconstruct it.\n3. **Encrypted traffic.** Everything after that, including the login form with your password, is encrypted with the session key. It is also authenticated, so any tampering in transit is detected and the connection fails.\n\n**What HTTPS does not protect against:**\n\n- A phishing site with its own valid certificate (the padlock only means the connection is private, not that the site is honest).\n- Malware or a malicious extension on your device, which sees the password before encryption.\n- A breach on the server side, where the site stores passwords badly. Good sites store only salted hashes.\n- Reusing the same password across sites.\n\nNext action: check that the address bar shows the correct domain before typing a password, and use a password manager. It fills credentials only on the exact domain you saved, which defeats most phishing.", "quiz": {"item": "08-explain", "q1": {"kind": "find", "text": "How does the secret session key end up on both your browser and the server?", "options": ["The server sends it, encrypted with your password", "Both sides derive it in a key exchange; it never crosses the network", "The certificate authority sends it to both", "The browser stores one permanent key for every site"], "answer": 1}, "q2": {"kind": "understand", "text": "Which threat does HTTPS NOT protect you from?", "options": ["An eavesdropper on public Wi-Fi", "Someone altering data in transit", "A phishing site with a valid certificate", "An attacker reading your password on the network"], "answer": 2}, "review": {"author_check": "answer supported by both versions (2026-11-12)", "independent_check": "LLM reviewer 2026-11-12: 22 PASS / 2 FIX (07 q1 giveaway, 08 q1 contradicted by baseline) — fixed; wording-bias and giveaway rewrites applied; human reviewer still recommended before launch"}}}, {"id": "09-ko-concept", "lang": "ko", "question": "도커랑 가상머신 차이가 뭐야?", "baseline": "**핵심 차이: 무엇을 가상화하느냐**\n\n- **가상머신(VM)**: 하드웨어를 가상화합니다. 하이퍼바이저(VMware, VirtualBox, KVM 등) 위에 게스트 OS 전체(커널 포함)를 통째로 올립니다.\n- **도커(컨테이너)**: OS를 가상화합니다. 호스트의 커널을 공유하고, 프로세스를 namespace/cgroups로 격리해서 따로 도는 것처럼 보이게 합니다.\n\n**비교**\n\n| | 가상머신 | 도커 컨테이너 |\n|---|---|---|\n| 격리 수준 | 강함 (커널까지 분리) | 상대적으로 약함 (커널 공유) |\n| 크기 | 수 GB | 수십~수백 MB |\n| 시작 시간 | 수십 초~분 | 거의 즉시 (초 단위 이하) |\n| 리소스 사용 | 무거움 (OS마다 메모리·CPU 점유) | 가벼움 |\n| OS 선택 | 호스트와 다른 OS 가능 (Windows 위에 Linux 등) | 호스트 커널과 동일 계열 (Linux 컨테이너는 Linux 커널) |\n| 이식성 | 이미지가 크고 무거움 | 이미지로 배포하기 쉬움 |\n\n**참고**\n- Mac/Windows에서 도커를 쓰면 내부적으로 작은 Linux VM을 하나 띄우고 그 위에서 컨테이너를 돌립니다. 그래서 \"Linux 커널 공유\"는 이 VM의 커널을 말합니다.\n- 보안상 강한 격리가 필요하면(멀티테넌트, 신뢰할 수 없는 코드) VM이 유리하고, 둘을 섞어 쓰기도 합니다(VM 안에서 컨테이너 실행, Kata Containers 등).\n\n**언제 무엇을 쓰나**\n- 도커: 애플리케이션 배포, 개발 환경 통일, 마이크로서비스, CI\n- VM: 다른 OS가 필요할 때, 강한 격리가 필요할 때, 레거시 시스템 전체를 돌릴 때", "brainres": "도커는 호스트 OS의 커널을 공유하는 프로세스 단위 격리이고, 가상머신은 하이퍼바이저 위에 게스트 OS를 통째로 올리는 하드웨어 단위 격리예요.\n\n| 항목 | 도커 컨테이너 | 가상머신 |\n|---|---|---|\n| 커널 | 호스트와 공유 | VM마다 별도 |\n| 시작 시간 | 보통 1초 안팎 | 수십 초에서 수 분 |\n| 크기 | 수십~수백 MB | 수 GB |\n| 격리 강도 | 약함 (커널 취약점이 공유됨) | 강함 |\n| 다른 OS 실행 | 불가 (Linux 컨테이너는 Linux 커널 필요) | 가능 |\n\n**컨테이너는 커널을 공유해서** 가볍고 빠르지만, 그만큼 격리가 약해요. 반대로 VM은 OS를 따로 돌리니 무겁지만 보안 경계가 더 단단해요.\n\n맥에서 도커를 쓰면 내부적으로 작은 Linux VM이 돌고, 그 안에서 컨테이너가 실행돼요. 맥 커널은 Linux 컨테이너를 직접 돌릴 수 없기 때문이에요.\n\n선택 기준은 간단해요. 같은 OS 위에서 앱을 빠르게 띄우고 배포하려면 도커, 다른 OS가 필요하거나 강한 격리가 필요하면 VM이 맞아요. 직접 확인하려면 `docker run --rm alpine uname -r`을 실행해 보세요. 호스트(또는 도커 VM)와 같은 커널 버전이 나와요.", "quiz": {"item": "09-ko-concept", "q1": {"kind": "find", "text": "도커 컨테이너와 가상머신의 가장 큰 차이는 무엇인가요?", "options": ["도커는 호스트 커널을 공유하고, 가상머신은 게스트 OS를 따로 올린다", "도커는 Windows에서만 동작한다", "가상머신이 도커보다 더 빨리 시작한다", "도커는 하드웨어 전체를 가상화한다"], "answer": 0}, "q2": {"kind": "understand", "text": "Linux 서버에서 Windows 전용 프로그램을 격리해 실행해야 한다면 무엇이 맞나요?", "options": ["도커 컨테이너", "가상머신", "둘 다 똑같이 가능", "둘 다 불가능"], "answer": 1}, "review": {"author_check": "answer supported by both versions (2026-11-12)", "independent_check": "LLM reviewer 2026-11-12: 22 PASS / 2 FIX (07 q1 giveaway, 08 q1 contradicted by baseline) — fixed; wording-bias and giveaway rewrites applied; human reviewer still recommended before launch"}}}, {"id": "10-ko-debug", "lang": "ko", "question": "리액트에서 useEffect가 두 번 실행돼. 왜 그래?", "baseline": "가장 흔한 원인은 **React 18의 Strict Mode**입니다.\n\n## 원인\n\n개발 모드에서 `<React.StrictMode>`로 앱을 감싸면, React가 컴포넌트를 마운트한 뒤 **의도적으로 한 번 언마운트 → 재마운트**합니다. 그래서 `useEffect`가 다음 순서로 실행됩니다.\n\n1. effect 실행\n2. cleanup 실행\n3. effect 다시 실행\n\n이는 effect가 cleanup을 제대로 구현했는지, 재실행되어도 안전한지 검증하기 위한 동작입니다. **프로덕션 빌드에서는 한 번만 실행됩니다.**\n\n```jsx\n// main.jsx / index.jsx\n<React.StrictMode>\n  <App />\n<\/React.StrictMode>\n```\n\nNext.js(App Router)는 기본적으로 Strict Mode가 켜져 있고, Vite/CRA 템플릿도 보통 포함되어 있습니다.\n\n## 해결 방법\n\nStrict Mode를 끄는 것은 권장하지 않고, **effect를 올바르게 작성**하는 게 정석입니다.\n\n**1. cleanup 함수 작성**\n\n```jsx\nuseEffect(() => {\n  const id = setInterval(tick, 1000);\n  return () => clearInterval(id);\n}, []);\n```\n\n**2. 데이터 fetch는 abort 처리**\n\n```jsx\nuseEffect(() => {\n  const controller = new AbortController();\n  fetch('/api/data', { signal: controller.signal })\n    .then(res => res.json())\n    .then(setData)\n    .catch(e => {\n      if (e.name !== 'AbortError') console.error(e);\n    });\n  return () => controller.abort();\n}, []);\n```\n\n**3. 이벤트 구독은 해제**\n\n```jsx\nuseEffect(() => {\n  window.addEventListener('resize', onResize);\n  return () => window.removeEventListener('resize', onResize);\n}, []);\n```\n\n**4. fetch는 라이브러리 사용 고려**: React Query, SWR 등은 중복 요청 처리를 알아서 해줍니다.\n\n## 다른 가능한 원인\n\n- **의존성 배열 값이 바뀌어서** 재실행되는 경우 (객체/배열/함수를 의존성에 넣으면 매 렌더마다 새로 만들어져 재실행됨)\n- **부모가 리마운트**되는 경우 (`key`가 바뀌거나 조건부 렌더링 위치가 바뀜)\n- **상태 변경으로 인한 리렌더**에서 의존성 배열이 없는 경우 (`useEffect(() => {...})`)\n\n## 임시로 확인만 하고 싶다면\n\nStrict Mode를 잠깐 꺼서 원인이 맞는지 확인할 수 있습니다.\n\n```jsx\n// StrictMode 제거\n<App />\n```\n\n한 번만 실행된다면 Strict Mode가 원인입니다. 확인 후엔 다시 켜두고 effect를 고치세요.\n\n코드를 보여주시면 어떤 경우인지 더 정확히 짚어드릴 수 있어요.", "brainres": "React 18 이상의 개발 모드에서 `<StrictMode>`가 컴포넌트를 일부러 두 번 마운트하기 때문일 가능성이 높아요 (~90% 확신).\n\n**원리**\n\nStrictMode는 마운트 → 언마운트 → 다시 마운트를 한 번씩 돌려요. 그래서 effect가 실행되고, cleanup이 실행되고, 다시 effect가 실행돼요. 클린업이 빠졌거나 effect가 멱등하지 않은 버그를 미리 찾아내려는 의도예요. 프로덕션 빌드에서는 한 번만 실행돼요.\n\n**확인 방법**\n\n`main.jsx`(또는 `index.js`)에 아래 코드가 있는지 보세요.\n\n```jsx\n<React.StrictMode>\n  <App />\n<\/React.StrictMode>\n```\n\n빌드한 결과물(`npm run build` 후 실행)에서 한 번만 찍히면 이 원인이 맞아요.\n\n**해결 방법**\n\nStrictMode를 끄는 것은 권장하지 않아요. 대신 effect가 두 번 돌아도 안전하도록 cleanup을 작성하세요.\n\n```jsx\nuseEffect(() => {\n  const controller = new AbortController();\n\n  fetch('/api/data', { signal: controller.signal })\n    .then(res => res.json())\n    .then(setData)\n    .catch(err => {\n      if (err.name !== 'AbortError') throw err;\n    });\n\n  return () => controller.abort(); // 첫 번째 실행을 취소해요\n}, []);\n```\n\n구독이나 타이머도 같아요. `addEventListener`는 `removeEventListener`로, `setInterval`은 `clearInterval`로 정리하면 돼요.\n\n**StrictMode가 아닌 다른 원인**\n\n프로덕션에서도 두 번 실행된다면 아래를 확인하세요.\n\n1. 의존성 배열의 객체나 함수가 렌더마다 새로 만들어지는지\n2. 부모가 `key` 변경이나 조건부 렌더링으로 컴포넌트를 다시 마운트하는지\n3. 같은 컴포넌트가 화면에 두 번 렌더되는지\n\n코드를 붙여주시면 어느 경우인지 바로 짚어드릴게요.", "quiz": {"item": "10-ko-debug", "q1": {"kind": "find", "text": "개발 모드에서 useEffect가 두 번 실행되는 가장 흔한 원인은 무엇인가요?", "options": ["의존성 배열을 비워서", "React 18 StrictMode가 개발 모드에서 컴포넌트를 다시 마운트해서", "브라우저 버그 때문에", "서버 사이드 렌더링 때문에"], "answer": 1}, "q2": {"kind": "understand", "text": "StrictMode를 끄지 않고 해결하는 권장 방법은 무엇인가요?", "options": ["useEffect 대신 useMemo를 쓴다", "effect에서 정리(cleanup) 함수를 반환해 재실행돼도 문제없게 만든다", "setTimeout으로 실행을 늦춘다", "의존성 배열을 지운다"], "answer": 1}, "review": {"author_check": "answer supported by both versions (2026-11-12)", "independent_check": "LLM reviewer 2026-11-12: 22 PASS / 2 FIX (07 q1 giveaway, 08 q1 contradicted by baseline) — fixed; wording-bias and giveaway rewrites applied; human reviewer still recommended before launch"}}}, {"id": "11-ko-stress", "lang": "ko", "question": "회사에서 실수로 프로덕션 DB 테이블을 지웠어. 지금 뭐부터 해야 해?", "baseline": "침착하게 아래 순서로 진행하세요. 핵심은 **더 이상 상황을 악화시키지 않는 것**입니다.\n\n## 1. 즉시 (처음 5분)\n- **추가 쓰기/수정 작업을 멈추세요.** 더 이상 DROP, DELETE, 마이그레이션, 배포를 하지 않습니다. 복구하려고 급하게 뭔가 실행하는 게 가장 위험합니다.\n- **바로 팀에 알리세요.** 팀 리드, DBA, 온콜 담당자에게 \"어떤 테이블, 대략 몇 시 몇 분, 어떤 DB/환경인지\" 공유합니다. 숨기면 복구가 늦어지고 피해가 커집니다.\n- **정확한 시각과 실행한 명령어를 기록하세요.** 복구 시점(PITR)을 정하는 데 필요합니다.\n\n## 2. 복구 수단 확인 (우선순위 순)\n1. **PITR (Point-in-Time Recovery)**: AWS RDS/Aurora, Cloud SQL, Azure 등 관리형 DB라면 삭제 직전 시점으로 **새 인스턴스에** 복원할 수 있습니다. 기존 인스턴스를 덮어쓰지 마세요.\n2. **자동/수동 스냅샷·백업**: 가장 최근 스냅샷 시각을 확인합니다.\n3. **리드 레플리카 / 스탠바이**: 삭제가 아직 복제되지 않았다면 바로 **복제를 중단(promote 전 상태 유지)** 하세요. 지연 레플리카(delayed replica)가 있으면 매우 유용합니다.\n4. **바이너리 로그/WAL 아카이브**: MySQL binlog, PostgreSQL WAL로 특정 시점까지 재생할 수 있습니다. 로그가 로테이션/삭제되지 않게 보존하세요.\n5. **트랜잭션 안에서 실행했다면** 아직 커밋 전일 수 있으니 `ROLLBACK`이 가능한지 확인하세요 (세션을 닫지 않은 상태에서).\n\n## 3. 복구 방식\n- 복원은 **별도 인스턴스에** 하고, 거기서 해당 테이블만 덤프해서 프로덕션에 다시 넣는 방식이 안전합니다.\n- 삭제 이후에 들어온 신규 데이터가 있다면 병합 계획이 필요합니다.\n- 복구 전에 **현재 상태의 스냅샷을 한 번 더** 떠 두세요.\n\n## 4. 이후\n- 영향 범위 파악 (어떤 서비스·고객이 영향을 받는지) 및 필요 시 공지\n- 사후 분석(blameless postmortem): 재발 방지책으로 프로덕션 접근 권한 분리, 읽기 전용 기본 계정, DDL 승인 절차, 터미널 프롬프트에 환경 표시, 백업 복구 훈련 등을 논의\n\n## 알려주시면 더 구체적으로 도와드릴 수 있어요\n- DB 종류 (MySQL/PostgreSQL 등)와 호스팅 환경 (AWS RDS, 자체 서버 등)\n- 삭제 후 경과 시간, 쓰기 트래픽이 계속 들어오는지\n- 백업/레플리카 설정 여부\n\n환경을 알려주시면 해당 환경에 맞는 정확한 복구 명령어를 안내해 드리겠습니다.", "brainres": "먼저 온콜 담당자에게 알리고, 복구 전까지 추가 명령은 실행하지 마세요. 혼자 고치려다 상황이 더 나빠지는 경우가 가장 흔해요.\n\n1. **트랜잭션 확인**: 삭제한 세션에서 `BEGIN`만 하고 `COMMIT`을 안 했다면 바로 `ROLLBACK` 하세요. Postgres는 DDL도 롤백돼요. MySQL은 `DROP`이 즉시 확정돼서 안 돼요.\n2. **알리기**: 팀 리더, DBA, 온콜에게 시각과 테이블 이름을 공유하세요. 빨리 알릴수록 복구가 쉬워요.\n3. **백업 보존**: 자동 스냅샷이나 WAL/binlog가 보존 기간 때문에 지워지지 않게 지금 수동 스냅샷을 하나 만드세요.\n4. **별도 복원**: 프로덕션을 덮어쓰지 말고, 삭제 직전 시점으로 새 인스턴스에 복원하세요. RDS나 Cloud SQL의 PITR이 이 용도예요.\n5. **테이블만 복구**: 복원본에서 해당 테이블만 덤프해 프로덕션에 넣으세요. 삭제 후 앱이 새로 쓴 데이터가 있으면 병합 방법을 팀과 정하세요.\n6. **기록**: 실행한 명령, 시각, 영향 범위를 적어 두세요. 나중에 원인 분석에 필요해요.\n\n앱이 없는 테이블에 계속 쓰려다 에러를 내거나 다른 테이블과 데이터가 어긋날 수 있어요. 그러면 복구 동안 점검 모드로 전환하는 것도 팀과 상의하세요.\n\nDB 종류(Postgres, MySQL 등)와 호스팅 환경(RDS, 자체 서버 등)을 알려주면 그에 맞는 복구 명령을 바로 알려드릴게요.", "quiz": {"item": "11-ko-stress", "q1": {"kind": "find", "text": "이 답에 따르면 지금 가장 먼저 할 일은 무엇인가요?", "options": ["백업으로 프로덕션 DB를 바로 덮어쓴다", "작업을 중단하고 팀(온콜·DBA)에 즉시 알린다", "같은 이름의 빈 테이블을 새로 만든다", "로그를 지우고 혼자 해결한다"], "answer": 1}, "q2": {"kind": "understand", "text": "백업에서 복원할 때 가장 안전한 방법은 무엇인가요?", "options": ["프로덕션 DB에 바로 덮어쓴다", "새 인스턴스에 복원한 뒤 필요한 테이블만 옮긴다", "개인 노트북에 복원한다", "복원하지 않고 기다린다"], "answer": 1}, "review": {"author_check": "answer supported by both versions (2026-11-12)", "independent_check": "LLM reviewer 2026-11-12: 22 PASS / 2 FIX (07 q1 giveaway, 08 q1 contradicted by baseline) — fixed; wording-bias and giveaway rewrites applied; human reviewer still recommended before launch"}}}, {"id": "12-ko-decision", "lang": "ko", "question": "파이썬에서 리스트랑 튜플 중에 뭘 써야 해?", "baseline": "**기본 원칙:** 내용이 바뀔 수 있으면 리스트, 고정된 묶음이면 튜플.\n\n**리스트(`list`)를 쓰는 경우**\n- 요소를 추가/삭제/수정해야 할 때\n- 같은 종류의 데이터가 여러 개 모인 컬렉션 (예: 사용자 이름 목록, 점수들)\n- 길이가 가변적일 때\n\n**튜플(`tuple`)을 쓰는 경우**\n- 값이 변하지 않는 고정된 구조 (예: 좌표 `(x, y)`, RGB `(255, 0, 0)`)\n- 서로 다른 의미의 값을 묶을 때 (예: `(\"홍길동\", 25, \"서울\")`)\n- 딕셔너리 키나 set 원소로 써야 할 때 (튜플은 해시 가능, 리스트는 불가)\n- 함수에서 여러 값을 반환할 때 (`return a, b`)\n- 실수로 수정되는 걸 막고 싶을 때\n\n**부가 차이**\n- 튜플이 약간 더 가볍고 생성이 빠르지만, 대부분은 체감할 정도가 아님\n- 문법: 리스트 `[1, 2]`, 튜플 `(1, 2)`. 요소가 하나인 튜플은 `(1,)`처럼 쉼표가 필요\n\n**간단한 판단법**\n```python\n# 같은 성격의 항목이 늘어날 수 있다 → 리스트\nfruits = [\"apple\", \"banana\"]\nfruits.append(\"cherry\")\n\n# 위치마다 의미가 다른 고정 레코드 → 튜플\npoint = (3, 4)\n```\n\n확신이 안 서면 리스트로 시작하고, \"이건 절대 안 바뀌어야 한다\"는 의도를 표현하고 싶을 때 튜플로 바꾸면 됩니다.", "brainres": "값을 나중에 바꿀 일이 있으면 리스트, 바꾸지 않을 고정된 묶음이면 튜플을 쓰세요.\n\n| | 리스트 `[]` | 튜플 `()` |\n|---|---|---|\n| 수정 | 가능 (append, 삭제 등) | 불가능 |\n| 용도 | 같은 종류의 값이 늘고 줄 때 | 서로 다른 값을 한 묶음으로 고정할 때 |\n| 딕셔너리 키 | 불가 | 가능 (값이 해시 가능할 때) |\n| 속도·메모리 | 약간 더 큼 | 약간 작고 빠름 |\n\n예를 들어 장바구니 상품 목록은 계속 추가하니까 리스트가 맞아요.\n\n```python\ncart = [\"사과\", \"배\"]\ncart.append(\"귤\")\n```\n\n반대로 좌표나 RGB 색상은 길이와 의미가 정해져 있으니 튜플이 맞아요.\n\n```python\npoint = (37.56, 126.97)\ncolors = {(255, 0, 0): \"빨강\"}   # 튜플은 키로 쓸 수 있음\n```\n\n속도 차이는 대부분 무시해도 돼요. 그래서 \"바뀌어야 하나?\"만 기준으로 정하면 충분해요.\n\n헷갈리면 일단 리스트로 시작하고, 나중에 \"이건 절대 안 바뀐다\"는 걸 알게 되면 튜플로 바꾸세요.", "quiz": {"item": "12-ko-decision", "q1": {"kind": "find", "text": "값이 나중에 바뀌어야 한다면 무엇을 쓰라고 하나요?", "options": ["튜플", "리스트", "딕셔너리", "아무거나 상관없다"], "answer": 1}, "q2": {"kind": "understand", "text": "좌표 한 쌍 x, y를 딕셔너리의 키로 쓰려면 무엇이 맞나요?", "options": ["리스트", "튜플", "둘 다 가능", "둘 다 불가능"], "answer": 1}, "review": {"author_check": "answer supported by both versions (2026-11-12)", "independent_check": "LLM reviewer 2026-11-12: 22 PASS / 2 FIX (07 q1 giveaway, 08 q1 contradicted by baseline) — fixed; wording-bias and giveaway rewrites applied; human reviewer still recommended before launch"}}}], "items_sha": "bc8e54cf2b500da7"};

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const md = s => (window.marked ? marked.parse(s) : "<pre>" + s.replace(/</g, "&lt;") + "</pre>");
const STUDY = DATA.study || 1, VERSIONS = DATA.versions || ["baseline", "brainres"];
let S = { id: rid(), study: STUDY, started: new Date().toISOString(), ua: navigator.userAgent.slice(0, 120), lang: null, fluent: null, list: Math.random() < 0.5 ? "A" : "B", trials: [], attention: null, preference: [] };
let L = T.en;

function view(html) { app.innerHTML = html; window.scrollTo(0, 0); }
function radio(name, opts) { return opts.map((o, i) => `<label class="opt"><input type="radio" name="${name}" value="${i}">${o}</label>`).join(""); }
function scale(name) { return `<div class="scale">${[1,2,3,4,5].map(v => `<label><input type="radio" name="${name}" value="${v}"> ${v}</label>`).join("")}</div>`; }
function picked(name) { const el = document.querySelector(`input[name="${name}"]:checked`); return el ? Number(el.value) : null; }
function waitFor(names, btn) { const b = document.getElementById(btn); const f = () => { b.disabled = !names.every(n => picked(n) !== null); }; document.querySelectorAll("input").forEach(i => i.addEventListener("change", f)); f(); }

function intro() {
  view(`<h1>${T.en.title}<br><span class="muted">${T.ko.title}</span></h1>
  <div class="card"><p>${T.en.intro}</p><p class="muted">${T.ko.intro}</p>
  <p>${["en", "ko"].filter(l => DATA.items.some(it => it.lang === l)).map(l => `<button onclick="pickLang('${l}')">${l === "en" ? "English set" : "한국어 세트"} (${DATA.items.filter(it => it.lang === l).length})</button>`).join(" ")}</p></div>`);
}
function pickLang(lang) {
  S.lang = lang; L = T[lang];
  view(`<div class="card"><label class="opt"><input type="checkbox" id="fl"> ${L.fluent}</label><p><button class="primary" onclick="begin()">${L.start}</button></p></div>`);
}
function begin() {
  S.fluent = document.getElementById("fl").checked;
  const items = shuffle(DATA.items.filter(it => it.lang === S.lang));
  // Counterbalancing: within each content group (study 2: causal / parallel), items sorted by id get
  // alternating versions; list B flips them. Study 1 has one group, so this is the original scheme.
  const group = it => it.content || "all";
  const order = g => DATA.items.filter(it => it.lang === S.lang && group(it) === g).map(it => it.id).sort();
  S.plan = items.map(it => { const k = order(group(it)).indexOf(it.id) % 2 === 0; const second = (S.list === "A") ? k : !k; return { id: it.id, content: it.content, version: VERSIONS[second ? 1 : 0] }; });
  S.attnAt = 1 + Math.floor(Math.random() * Math.max(1, S.plan.length - 1));
  S.step = 0; trial();
}
function progress() { const n = S.plan.length; return `<div class="progress"><div style="width:${Math.round(100 * S.step / n)}%"></div></div>`; }
function trial() {
  if (S.step === S.attnAt && S.attention === null) return attention();
  if (S.step >= S.plan.length) return DATA.preference === false ? finish() : preference();
  const p = S.plan[S.step], it = DATA.items.find(x => x.id === p.id), quiz = it.quiz, opts1 = shuffle(quiz.q1.options.map((o, i) => [o, i]));
  view(`${progress()}<div class="card"><div class="muted">${L.read}</div><div class="q">${it.question}</div></div>
  <div class="card answer">${md(it[p.version])}</div>
  <div class="card"><div class="q">${quiz.q1.text}</div><div class="muted">${L.q1}</div>${radio("q1", opts1.map(o => o[0]))}<p>${L.conf}</p>${scale("c1")}<p><button class="primary" id="b1">${L.next}</button></p></div>`);
  const t0 = performance.now(); waitFor(["q1", "c1"], "b1");
  document.getElementById("b1").onclick = () => { const choice = opts1[picked("q1")][1]; const rec = { id: p.id, content: p.content, version: p.version, q1: { correct: choice === quiz.q1.answer, ms: Math.round(performance.now() - t0), conf: picked("c1") } }; q2(it, rec); };
}
function q2(it, rec) {
  const quiz = it.quiz, opts2 = shuffle(quiz.q2.options.map((o, i) => [o, i]));
  view(`${progress()}<div class="card"><div class="q">${quiz.q2.text}</div><div class="muted">${L.q2}</div>${radio("q2", opts2.map(o => o[0]))}<p>${L.conf}</p>${scale("c2")}<p><button class="primary" id="b2">${L.next}</button></p></div>`);
  const t0 = performance.now(); waitFor(["q2", "c2"], "b2");
  document.getElementById("b2").onclick = () => { const choice = opts2[picked("q2")][1]; rec.q2 = { correct: choice === quiz.q2.answer, ms: Math.round(performance.now() - t0), conf: picked("c2") }; S.trials.push(rec); S.step++; trial(); };
}
function attention() {
  const opts = shuffle(["Red", "Blue", "Green", "Yellow"]);
  view(`${progress()}<div class="card"><div class="q">${L.attn}</div>${radio("at", opts)}<p><button class="primary" id="ba">${L.next}</button></p></div>`);
  waitFor(["at"], "ba");
  document.getElementById("ba").onclick = () => { S.attention = opts[picked("at")] === "Blue"; trial(); };
}
function preference() {
  const pool = shuffle(DATA.items.filter(it => it.lang === S.lang)).slice(0, 2);
  const show = (k) => {
    if (k >= pool.length) return finish();
    const it = pool[k], leftIsBrainres = Math.random() < 0.5;
    const L1 = leftIsBrainres ? it.brainres : it.baseline, R1 = leftIsBrainres ? it.baseline : it.brainres;
    view(`<div class="card"><div class="muted">${L.read}</div><div class="q">${it.question}</div></div>
    <div class="two"><div class="card answer">${md(L1)}</div><div class="card answer">${md(R1)}</div></div>
    <div class="card"><div class="q">${L.pref}</div>${radio("pf", [L.left, L.right, L.same])}<p><button class="primary" id="bp">${L.next}</button></p></div>`);
    waitFor(["pf"], "bp");
    document.getElementById("bp").onclick = () => { const v = picked("pf"); S.preference.push({ id: it.id, choice: v === 2 ? "same" : ((v === 0) === leftIsBrainres ? "brainres" : "baseline") }); show(k + 1); };
  };
  show(0);
}
function finish() {
  S.finished = new Date().toISOString(); S.items_sha = DATA.items_sha; delete S.step; delete S.attnAt;
  const json = JSON.stringify(S, null, 1);
  view(`<div class="card"><h2>${L.done}</h2>
  <p><button class="primary" id="dl">${L.dl}</button> <button id="cp">${L.copy}</button></p>
  <p><a href="${REPO}/issues/new?template=benchmark-result.yml&title=${encodeURIComponent(`Benchmark result (study ${STUDY})`)}" target="_blank" rel="noopener">${L.issue} →</a></p>
  <textarea readonly>${json.replace(/</g, "&lt;")}</textarea></div>`);
  document.getElementById("dl").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([json], { type: "application/json" })); a.download = `brainres-bench${STUDY === 1 ? "" : STUDY}-${S.id}.json`; a.click(); };
  document.getElementById("cp").onclick = () => { try { navigator.clipboard.writeText(json); } catch (e) {} };
}
// #autotest: click through the whole study with the first options (used by validate.sh via headless Chrome)
function autotest() {
  const tick = () => {
    const btns = [...document.querySelectorAll("button")];
    const lang = btns.find(b => b.textContent.startsWith("English set"));
    if (lang) { lang.click(); return setTimeout(tick, 0); }
    const fl = document.getElementById("fl"); if (fl) { fl.checked = true; begin(); return setTimeout(tick, 0); }
    const ta = document.querySelector("textarea"); if (ta) { document.title = "AUTOTEST_DONE"; return; }
    ["q1","c1","q2","c2","at","pf"].forEach(n => { const r = document.querySelector(`input[name="${n}"]`); if (r) { r.checked = true; r.dispatchEvent(new Event("change")); } });
    const next = document.querySelector("button.primary"); if (next) next.click();
    setTimeout(tick, 0);
  };
  setTimeout(tick, 0);
}
intro();
if (location.hash === "#autotest") autotest();
</script>
</body>
</html>
